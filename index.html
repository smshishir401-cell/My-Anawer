<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Answer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 10px;
            font-family: 'Courier New', Courier, monospace;
        }

        /* কাগজের স্টাইল */
        .paper {
            background: #fdfbf7;
            background-image: linear-gradient(#e8e4d9 1px, transparent 1px);
            background-size: 100% 28px;
            width: 100%;
            max-width: 650px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 30px 20px;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5), inset 0 0 40px rgba(0, 0, 0, 0.05);
            border-left: 4px solid #e06c75;
            position: relative;
            word-wrap: break-word;
            word-break: break-all;
            line-height: 28px;
            color: #333;
        }

        /* কাগজের শিরোনাম */
        .title {
            font-size: 26px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 20px;
            color: #111;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        /* ডট (Dot) লেখার এরিয়া - সামান্য বোল্ড করার জন্য font-weight যোগ করা হয়েছে */
        .content {
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            text-align: justify;
            white-space: pre-wrap;
        }

        /* মাঝের বিশেষ টেক্সট এর স্টাইল */
        .yes-highlight {
            display: inline-block;
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            color: #2e7d32;
            margin: 20px auto;
            padding: 12px 8px;
            background: rgba(46, 125, 50, 0.1);
            border: 3px dashed #2e7d32;
            border-radius: 8px;
            letter-spacing: 2px;
            line-height: 36px;
            width: 100%;
        }

        @media (max-width: 480px) {
            .paper {
                padding: 20px 12px;
            }
            .title {
                font-size: 22px;
            }
            .content {
                font-size: 14px;
                letter-spacing: 1.5px;
            }
            .yes-highlight {
                font-size: 22px;
                margin: 15px 0;
                line-height: 30px;
            }
        }
    </style>
</head>
<body>

    <div class="paper" id="paperBox">
        <div class="title">My Answer Is:</div>
        <div class="content" id="dotsContainer"></div>
    </div>

    <script>
        const container = document.getElementById('dotsContainer');
        const paperBox = document.getElementById('paperBox');

        // প্রথম ১০,০০০ ডট -> বিশেষ মেসেজ -> পরবর্তী ১০,০০০ ডট
        const part1 = '.'.repeat(10000);
        const targetHtml = '<span class="yes-highlight">[Sahi pakre ho—\'Yes\'😅😶‍🌫️]</span>';
        const part2 = '.'.repeat(10000);

        let currentIndex = 0;
        let isTypingHtml = false;
        
        function typeWriter() {
            if (currentIndex < part1.length) {
                // স্বাভাবিক গতির জন্য একসাথে কম ডট (১০টি করে) যোগ করা হচ্ছে এবং স্পিড ২৫ মিলি সেকেন্ড করা হয়েছে
                container.innerHTML += part1.substring(currentIndex, currentIndex + 10);
                currentIndex += 10;
                paperBox.scrollTop = paperBox.scrollHeight;
                setTimeout(typeWriter, 25);
            } else if (!isTypingHtml) {
                // মাঝখানের বিশেষ টেক্সট ইনসার্ট করা
                container.innerHTML += targetHtml;
                isTypingHtml = true;
                paperBox.scrollTop = paperBox.scrollHeight;
                currentIndex = 0;
                setTimeout(typeWriter, 50);
            } else if (currentIndex < part2.length) {
                // শেষের ডটগুলো স্বাভাবিক গতিতে টাইপ হওয়া
                container.innerHTML += part2.substring(currentIndex, currentIndex + 10);
                currentIndex += 10;
                paperBox.scrollTop = paperBox.scrollHeight;
                setTimeout(typeWriter, 25);
            }
        }

        // পেজ লোড হওয়ার একটু পর অ্যানিমেশন শুরু হবে
        window.onload = () => {
            setTimeout(typeWriter, 500);
        };
    </script>

</body>
</html>
