<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorry Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* সোনালী ব্যাকগ্রাউন্ড (Gradient) */
            background: linear-gradient(135deg, #bf953f, #fc6, #b38728, #fbf5b7, #aa771c);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Courier New', Courier, monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(0, 0, 0, 0.65);
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 2px solid #ffd700;
        }

        h1 {
            color: #ffd700;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .text-box {
            color: #fff;
            font-size: clamp(1rem, 3.5vw, 1.4rem);
            line-height: 1.6;
            min-height: 150px;
            max-height: 300px;
            overflow-y: auto;
            text-align: left;
            padding: 10px;
            border: 1px dashed rgba(255, 215, 0, 0.4);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            word-break: break-all;
        }

        /* স্ক্রলবার স্টাইল */
        .text-box::-webkit-scrollbar {
            width: 6px;
        }
        .text-box::-webkit-scrollbar-thumb {
            background: #ffd700;
            border-radius: 3px;
        }

        .counter {
            margin-top: 15px;
            color: #ffdf73;
            font-size: 0.9rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>আন্তরিকভাবে দুঃখিত!</h1>
        <div class="text-box" id="typingText"></div>
        <div class="counter" id="counterDisplay">টাইপ হয়েছে: ০ / ৩০০০০ বার</div>
    </div>

    <script>
        const targetWord = "Sorry, ";
        const maxCount = 30000; // মোট ৩০০০০ বার
        let currentCount = 0;
        
        const textBox = document.getElementById("typingText");
        const counterDisplay = document.getElementById("counterDisplay");

        function typeText() {
            if (currentCount < maxCount) {
                currentCount++;
                textBox.innerHTML += targetWord;
                counterDisplay.innerText = `টাইপ হয়েছে: ${currentCount} / ${maxCount} বার`;
                
                // অটো স্ক্রল নিচে রাখার জন্য
                textBox.scrollTop = textBox.scrollHeight;

                // টাইপিং গতি নিয়ন্ত্রণ করতে এখানে মিলিসেকেন্ড পরিবর্তন করতে পারেন (যেমন: ২০ মিলি সেকেন্ড)
                let speed = currentCount < 100 ? 100 : 10; 
                setTimeout(typeText, speed);
            } else {
                counterDisplay.innerText = `৩০০০০ বার "Sorry" লেখা সম্পন্ন হয়েছে!`;
            }
        }

        // পেজ লোড হওয়ার একটু পর টাইপিং শুরু হবে
        window.onload = function() {
            setTimeout(typeText, 500);
        };
    </script>

</body>
</html>
